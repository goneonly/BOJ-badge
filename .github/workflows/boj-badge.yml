name: BOJ badge

on:
  schedule:
    - cron: "0 0 * * *" # 매일 UTC 00:00 = 한국 시간 오전 9시
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

env:
  BOJ_HANDLE: onlygone

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate badges
        run: python generate.py --handle "$BOJ_HANDLE"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/
          git diff --cached --quiet || git commit -m "chore: update BOJ badge"
          git push
